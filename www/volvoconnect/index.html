<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolvoConnect OAuth Handler</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; background: #151f1b; color: #f4f4e9; margin: 0; padding: 12px; font-size: 14px; line-height: 1.4; }
        .wrap { width: 100%; max-width: 820px; margin: 0 auto; background: #1d2825; border: 1px solid #46544c; box-shadow: 0 16px 44px #0c16124a; overflow: hidden; }
        .toolbar { min-height: 76px; padding: 0 24px; background: #202e29; border-bottom: 1px solid #405149; display: flex; align-items: center; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
        .brand-mark { width: 39px; height: 39px; flex: 0 0 39px; border: 2px solid #52bd8b; border-radius: 50%; color: #52bd8b; display: grid; place-items: center; }
        .brand-mark svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .brand small { font: 700 10px 'Helvetica Neue', sans-serif; letter-spacing: 1.2px; color: #a9b7ac; }
        h1 { font: 500 22px Georgia, serif; margin: 3px 0; letter-spacing: 0; line-height: 1.1; }
        .content { padding: 22px 24px 24px; background: linear-gradient(155deg, #26352e, #1b2823 62%, #202c27); }
        h2 { font: 500 17px Georgia, serif; margin: 25px 0 10px; color: #52bd8b; border-bottom: 1px solid #46534a; padding-bottom: 9px; }
        .status { padding: 12px 15px; border: 1px solid; margin: 15px 0; font-weight: 600; }
        .success { background: #214132; color: #9ce2bb; border-color: #52bd8b; }
        .error { background: #412622; color: #f2b8ac; border-color: #d45b45; }
        .info { background: #22333c; color: #bcd9ea; border-color: #8ab6d1; }
        .code-box { background: #202e29; padding: 15px; border: 1px solid #46534a; color: #edf0e6; font-family: monospace; word-break: break-all; margin: 15px 0; }
        button { display: inline-block; padding: 8px 12px; margin: 0; background: #26342d; color: #f4f4e9; border: 1px solid #52bd8b; cursor: pointer; font: 600 12px 'Helvetica Neue', sans-serif; transition: background 0.2s; }
        button:hover { background: #34463c; }
        button:disabled { opacity: .55; cursor: wait; }
        .device-list { margin-top: 20px; }
        .device-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 15px;
            background: #26342d;
            border-top: 2px solid #52bd8b;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .device-item:nth-child(3n) { border-top-color: #e3b953; }
        .device-item:nth-child(3n+2) { border-top-color: #8ab6d1; }
        .device-item:hover { background: #2c3b33; }
        .device-info { flex: 1; min-width: 0; }
        .device-name { font: 500 17px Georgia, serif; color: #edf0e6; }
        .device-status { font-size: 0.9em; color: #9fac9f; margin-top: 6px; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border: 1px solid;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.5;
            margin-right: 10px;
        }
        .badge-auth { border-color: #52bd8b; background: #214132; color: #9ce2bb; }
        .badge-noauth { border-color: #d45b45; background: #412622; color: #f2b8ac; }
        .badge-unknown { border-color: #8ab6d1; background: #22333c; color: #bcd9ea; }
        .device-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .loading { text-align: center; padding: 20px; color: #a9b7ac; }
        .spinner {
            display: inline-block;
            border: 3px solid #46534a;
            border-top: 3px solid #52bd8b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-message {
            color: #9ce2bb;
            font-size: 0.9em;
            padding: 8px 12px;
            background: #214132;
            border: 1px solid #52bd8b;
            margin-top: 8px;
            display: none;
        }
        @media (max-width: 500px) {
            .toolbar { align-items: flex-start; flex-wrap: wrap; gap: 10px; padding: 13px 15px; }
            .content { padding: 14px 12px; }
            .device-item { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="toolbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 14.5 4.5 9h15l1.5 5.5V19h-2v-2H5v2H3z"/><path d="M5 9l2-4h10l2 4M3 13h18"/><circle cx="7" cy="14" r="1"/><circle cx="17" cy="14" r="1"/></svg></span>
                <div><small>VOLVO CONNECT / OAUTH</small><h1>OAuth 2.0 Handler</h1></div>
            </div>
        </div>
        <div class="content">
        <div id="status"></div>
        
        <div id="codeSection" style="display: none;">
            <h2>Authorization Code</h2>
            <p><strong>Your Code:</strong></p>
            <div class="code-box" id="code"></div>
            <button class="btn-primary" onclick="copyCode()">📋 Copy Code</button>
            
            <h2>Devices</h2>
            <div id="deviceList" class="device-list">
                <div class="loading">
                    <span class="spinner"></span>Loading VolvoConnect Devices...
                </div>
            </div>
        </div>
        
        <div id="errorSection" style="display: none;">
            <h2>Error Details</h2>
            <div class="code-box" id="error"></div>
        </div>
        </div>
    </div>

    <script>
        var code = new URL(window.location).searchParams.get('code');
        var error = new URL(window.location).searchParams.get('error');
        var errorDesc = new URL(window.location).searchParams.get('error_description');
        
        var statusEl = document.getElementById('status');
        var codeSection = document.getElementById('codeSection');
        var codeEl = document.getElementById('code');
        var errorSection = document.getElementById('errorSection');
        var errorEl = document.getElementById('error');
        var deviceListEl = document.getElementById('deviceList');
        
        if (error) {
            statusEl.className = 'status error';
            statusEl.textContent = '⚠️ Authorization Error: ' + error;
            errorEl.textContent = decodeURIComponent(errorDesc || 'Unknown error');
            errorSection.style.display = 'block';
        } else if (code) {
            statusEl.className = 'status success';
            statusEl.textContent = '✓ Authorization Successful!';
            codeEl.textContent = code;
            codeSection.style.display = 'block';
            loadDevices();
        } else {
            statusEl.className = 'status info';
            statusEl.textContent = 'ℹ️ OAuth Handler Ready';
        }
        
        function copyCode() {
            navigator.clipboard.writeText(code).then(function() {
                alert('Code copied to clipboard!');
            }).catch(function() {
                alert('Failed to copy');
            });
        }

        function loadDevices() {
            fetch('/fhem?cmd=list%20TYPE=VolvoConnect&XHR=1')
                .then(response => response.text())
                .then(data => {
                    console.log('Raw response from FHEM:', data);
                    var devices = [];
                    var lines = data.trim().split('\n');
                    
                    console.log('Number of lines:', lines.length);
                    
                    lines.forEach((line, index) => {
                        line = line.trim();
                        console.log('Line ' + index + ':', line);
                        // Each line is a device name if it's not empty
                        if (line.length > 0) {
                            devices.push(line);
                            console.log('Found device:', line);
                        }
                    });
                    
                    console.log('Extracted devices:', devices);
                    
                    if (devices.length === 0) {
                        deviceListEl.innerHTML = '<div class="status info">No VolvoConnect devices found. Check browser console for debug info.</div>';
                        return;
                    }
                    
                    deviceListEl.innerHTML = '';
                    
                    devices.forEach(deviceName => {
                        fetch('/fhem?cmd=get%20' + encodeURIComponent(deviceName) + '%20summary&XHR=1')
                            .then(response => response.text())
                            .then(summary => {
                                var authStatus = 'unknown';
                                var statusBadgeClass = 'badge-unknown';
                                var statusIcon = '❓';
                                
                                if (summary.includes('authStatus: auth_valid')) {
                                    authStatus = 'authenticated';
                                    statusBadgeClass = 'badge-auth';
                                    statusIcon = '✓';
                                } else if (summary.includes('authStatus: auth_required')) {
                                    authStatus = 'requires_auth';
                                    statusBadgeClass = 'badge-noauth';
                                    statusIcon = '⚠️';
                                } else if (summary.includes('authStatus: auth_invalid')) {
                                    authStatus = 'invalid_auth';
                                    statusBadgeClass = 'badge-noauth';
                                    statusIcon = '❌';
                                }
                                
                                var deviceHTML = '<div class="device-item">' +
                                    '<div class="device-info">' +
                                    '  <div class="device-name">' + htmlEscape(deviceName) + '</div>' +
                                    '  <div class="device-status">' +
                                    '    <span class="status-badge ' + statusBadgeClass + '">' + statusIcon + ' ' + authStatus + '</span>' +
                                    '  </div>' +
                                    '</div>' +
                                    '<div class="device-actions">' +
                                    '  <button class="btn-success" onclick="setAuthCode(\'' + htmlEscape(deviceName) + '\')">Set authCode</button>' +
                                    '  <div id="message-' + htmlEscape(deviceName) + '" class="success-message"></div>' +
                                    '</div>' +
                                    '</div>';
                                
                                deviceListEl.innerHTML += deviceHTML;
                            })
                            .catch(err => {
                                console.error('Failed to load device summary for ' + deviceName + ':', err);
                            });
                    });
                })
                .catch(err => {
                    console.error('Failed to load devices:', err);
                    deviceListEl.innerHTML = '<div class="status error">Failed to load devices: ' + err.message + '</div>';
                });
        }

        function setAuthCode(deviceName) {
            var button = event.target;
            button.disabled = true;
            button.textContent = 'Setting...';
            
            var cmd = 'set ' + deviceName + ' authCode ' + code;
            
            fetch('/fhem?cmd=' + encodeURIComponent(cmd) + '&XHR=1')
                .then(response => response.text())
                .then(result => {
                    var messageEl = document.getElementById('message-' + deviceName);
                    messageEl.style.display = 'block';
                    messageEl.textContent = '✓ Authorization code set successfully!';
                    button.textContent = '✓ Set';
                    button.style.background = '#52bd8b';
                    button.style.color = '#1d2825';
                    
                    setTimeout(() => {
                        messageEl.style.display = 'none';
                        button.disabled = false;
                        button.textContent = 'Set authCode';
                        button.style.background = '';
                        button.style.color = '';
                    }, 3000);
                })
                .catch(err => {
                    var messageEl = document.getElementById('message-' + deviceName);
                    messageEl.style.display = 'block';
                    messageEl.textContent = '❌ Failed: ' + err.message;
                    messageEl.style.background = '#412622';
                    messageEl.style.color = '#f2b8ac';
                    messageEl.style.borderColor = '#d45b45';
                    button.disabled = false;
                    button.textContent = 'Set authCode';
                });
        }

        function htmlEscape(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
