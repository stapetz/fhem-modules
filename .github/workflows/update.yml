name: Generate FHEM Controls

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGED files from Git commits
        run: python3 scripts/generate_changed.py

      - name: Generate Controls Files
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          modules = {
              "controls_volvo.txt": {
                  "primary": "FHEM/50_VolvoConnect.pm",
                  "files": ["www/volvoconnect/oauth-redirect.pl", "www/volvoconnect/README.md", "www/volvoconnect/styles.css"]
              },
              "controls_temperaturecollector.txt": {
                  "primary": "FHEM/50_TemperatureCollector.pm",
                  "files": []
              },
              "controls_gavazzi.txt": {
                  "primary": "FHEM/70_GavazziEM24.pm",
                  "files": []
              },
              "controls_solax.txt": {
                  "primary": "FHEM/70_SolaxModbus.pm",
                  "files": []
              },
              "controls_dashboardhub.txt": {
                  "primary": "FHEM/50_DashboardHub.pm",
                  "files": []
              },
              "controls_thermostatdashboard.txt": {
                  "primary": "FHEM/50_ThermostatDashboard.pm",
                  "files": []
              },
          }
          changed_timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d_%H:%M:%S")

          def changed_line(name):
              return f"UPD {changed_timestamp} {Path(name).stat().st_size} {name}"

          def last_update(path):
              return subprocess.check_output(
                  [
                      "git",
                      "log",
                      "--pretty=format:%cd",
                      "-n",
                      "1",
                      "--date=format:%Y-%m-%d_%H:%M:%S",
                      "--",
                      str(path),
                  ],
                  text=True,
              ).strip()

          all_lines = []

          for controls_name, config in modules.items():
              key = controls_name[len("controls_"):-len(".txt")]
              module = Path(config["primary"])
              lines = []
              
              module_line = (
                  f"UPD {last_update(module)} {module.stat().st_size} {config['primary']}"
              )
              lines.append(module_line)
              all_lines.append(module_line)
              
              for file in config["files"]:
                  file_path = Path(file)
                  if file_path.exists():
                      file_line = (
                          f"UPD {last_update(file)} {file_path.stat().st_size} {file}"
                      )
                      lines.append(file_line)
                      all_lines.append(file_line)
              
              lines.append(changed_line(f"CHANGED_{key}"))
              Path(controls_name).write_text(
                  "\n".join(lines) + "\n", encoding="ascii"
              )

          Path("controls_all.txt").write_text(
              "\n".join(all_lines + [changed_line("CHANGED")]) + "\n", encoding="ascii"
          )
          PY

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of controls files [skip ci]"
          file_pattern: "controls_*.txt CHANGED CHANGED_*"